<title>Saath Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Noto+Sans+Devanagari:wght@400..700&family=Noto+Sans+Kannada:wght@400..700&family=Noto+Serif+Kannada:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap">
<style>
/* Saath v2 — calm and typographic. A serif for the human sentence, Inter for the interface,
   hairline lists instead of boxes, colour only for status (fine / attention / emergency). */
:root{
  --bg:#FFFFFF; --bg-2:#F4F4F1; --ink:#1B1B19; --ink-2:#4F4F4A; --mu:#7C7C75; --line:#E6E6E1;
  --ok:#1D7A52; --ok-bg:#E5F1EA; --warn:#9C5A00; --warn-bg:#F8ECD9; --sos:#C3302A; --sos-bg:#FBE6E4;
  --btn:#1B1B19; --on-btn:#FFFFFF;
  --av-amma:#F1E6DA; --av-amma-ink:#7A4E26; --av-appa:#E2E7F0; --av-appa-ink:#344A73; --av-priya:#E1EDE5; --av-priya-ink:#1E6646;
  --serif:"Source Serif 4","Noto Serif Kannada",Georgia,serif;
  --sans:"Inter","Noto Sans Kannada","Noto Sans Devanagari",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121211; --bg-2:#1C1C1A; --ink:#EFEFEA; --ink-2:#C4C4BC; --mu:#8F8F87; --line:#2A2A27;
  --ok:#5CC796; --ok-bg:#15271E; --warn:#EFA54C; --warn-bg:#2C2113; --sos:#FF6A60; --sos-bg:#331716;
  --btn:#EFEFEA; --on-btn:#121211;
  --av-amma:#3A2C20; --av-amma-ink:#F0CFAE; --av-appa:#232C3D; --av-appa-ink:#BCCBEA; --av-priya:#1B3127; --av-priya-ink:#A9DDBF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121211; --bg-2:#1C1C1A; --ink:#EFEFEA; --ink-2:#C4C4BC; --mu:#8F8F87; --line:#2A2A27;
  --ok:#5CC796; --ok-bg:#15271E; --warn:#EFA54C; --warn-bg:#2C2113; --sos:#FF6A60; --sos-bg:#331716;
  --btn:#EFEFEA; --on-btn:#121211;
  --av-amma:#3A2C20; --av-amma-ink:#F0CFAE; --av-appa:#232C3D; --av-appa-ink:#BCCBEA; --av-priya:#1B3127; --av-priya-ink:#A9DDBF; color-scheme:dark}

/* ---------- shell ---------- */
.sa{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;isolation:isolate}
.sa *{box-sizing:border-box;margin:0}
:where(.sa) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.sa button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:12px}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.sa-status{display:none;position:absolute;left:0;right:0;top:0;height:40px;z-index:30;align-items:center;justify-content:space-between;padding:8px 26px 0 30px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.sa.framed .sa-status{display:flex}
.sa-status .cam{position:absolute;left:50%;top:13px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#000}
.sa.on-dark .sa-status{color:#fff}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform,opacity}
.sa.framed .layer{padding-top:40px}
.sa.framed .layer.flush{padding-top:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.page{padding:8px 22px 32px}
.gesture{display:none}
.sa.framed .gesture{display:block;position:absolute;left:50%;bottom:7px;width:112px;height:4px;margin-left:-56px;border-radius:2px;background:currentColor;opacity:.3;z-index:60}

/* ---------- type ---------- */
.h1{font-family:var(--serif);font-weight:500;font-size:31px;line-height:1.16;letter-spacing:-.012em;text-wrap:balance}
.h2{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.meta{font-size:14px;color:var(--mu)}
.sec{font-size:14px;font-weight:600;color:var(--mu);margin:30px 0 2px}
.num{font-variant-numeric:tabular-nums}
.ok-t{color:var(--ok)} .warn-t{color:var(--warn)} .sos-t{color:var(--sos)}

/* ---------- bars ---------- */
.appbar{flex:none;height:56px;display:flex;align-items:center;gap:2px;padding:0 8px}
.appbar .ttl{font-size:17px;font-weight:600}
.icon-btn{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.topline{display:flex;align-items:center;justify-content:space-between;padding:14px 0 18px}
.brandline{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:19px;font-weight:600}

/* ---------- people & events ---------- */
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;font-weight:500;flex:none}
.av.sm{width:34px;height:34px;font-size:15px}
.av.lg{width:64px;height:64px;font-size:28px}
.av.amma{background:var(--av-amma);color:var(--av-amma-ink)} .av.appa{background:var(--av-appa);color:var(--av-appa-ink)} .av.priya{background:var(--av-priya);color:var(--av-priya-ink)}
.list{border-top:1px solid var(--line)}
.person{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line);width:100%}
.person .tx{flex:1;min-width:0}
.person .nm{font-size:17px;font-weight:600}
.person .ln{font-size:14.5px;color:var(--ink-2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.sos{background:var(--sos)} .dot.wait{box-shadow:inset 0 0 0 2px var(--mu)}
.ev{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:15px 0;border-bottom:1px solid var(--line)}
.ev .tm{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:2px;color:var(--ink-2)}
.ev .tt{font-size:16.5px;font-weight:600;line-height:1.35}
.ev .ds{font-size:14.5px;color:var(--ink-2)}
.ev .act{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.flag{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600;color:var(--warn);margin-top:8px}
.good{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600;color:var(--ok);margin-top:8px}

/* ---------- buttons ---------- */
.btn{height:52px;border-radius:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:600;background:var(--btn);color:var(--on-btn);transition:transform .12s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sos-line{background:transparent;color:var(--sos);box-shadow:inset 0 0 0 1.5px var(--sos)}
.btn.on-red{background:#fff;color:#A3231D}
.btn.sm{height:42px;border-radius:12px;font-size:15px;width:auto;padding:0 16px}
.link{font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- key–value rows ---------- */
.kv{margin-top:22px;border-top:1px solid var(--line)}
.kv .r{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.kv .k{color:var(--mu);font-size:14px;padding-top:1px}
.kv .v small{display:block;font-size:13.5px;color:var(--mu);margin-top:2px}
.foot{flex:none;padding:14px 22px 16px;background:var(--bg);border-top:1px solid var(--line)}
.sa.framed .foot{padding-bottom:28px}
.foot .meta{text-align:center;margin-top:9px;font-size:13px}

/* ---------- parent page ---------- */
.week{display:flex;gap:6px;margin-top:12px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.week i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 6px;background:var(--ok)}
.week i.miss{background:none;box-shadow:inset 0 0 0 2px var(--warn)}
.week i.now{background:none;box-shadow:inset 0 0 0 2px var(--mu)}
.ladder{counter-reset:l;margin-top:6px}
.ladder li{list-style:none;display:grid;grid-template-columns:28px 1fr;gap:8px;padding:9px 0;font-size:15px;color:var(--ink-2)}
.ladder li::before{counter-increment:l;content:counter(l);width:24px;height:24px;border-radius:50%;background:var(--bg-2);color:var(--ink);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ---------- visit ---------- */
.tl{margin-top:20px}
.tl .it{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:12px 0;position:relative}
.tl .it .tm{font-size:14px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tl .it .tt{font-size:16px;font-weight:600}
.tl .it .ds{font-size:14px;color:var(--mu)}
.photo{margin-top:10px;height:132px;border-radius:14px;background:linear-gradient(160deg,#D9CBB7,#9F8A73);position:relative;overflow:hidden}
.photo::before{content:"";position:absolute;left:30%;bottom:-6px;width:58px;height:92px;border-radius:29px 29px 8px 8px;background:#6A5545}
.photo::after{content:"";position:absolute;left:52%;bottom:-6px;width:54px;height:104px;border-radius:27px 27px 8px 8px;background:#3F3A4E}
.note{margin-top:8px;background:var(--bg-2);border-radius:18px;padding:18px 18px 8px}
.note .lab{font-size:13.5px;font-weight:600;color:var(--mu)}
.quote{font-family:var(--serif);font-size:19px;line-height:1.5;margin-top:8px}
.note .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid var(--line);font-size:15px;margin-top:14px}
.note .row + .row{margin-top:0}

/* ---------- alert (child) ---------- */
.redtop{background:var(--sos);color:#fff;padding:12px 22px 24px}
.sa.framed .redtop{padding-top:52px}
.redtop .h1{color:#fff}
.redtop .meta{color:rgba(255,255,255,.85)}
.live{margin-top:8px}
.live .it{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.live .it .ic{color:var(--ok);margin-top:2px}
.live .it small{display:block;color:var(--mu);font-size:13.5px}
.live .it.big{font-family:var(--serif);font-size:18px;line-height:1.45}

/* ---------- sheets, banners, toasts ---------- */
.dim{position:absolute;inset:0;background:rgba(15,15,12,.4);z-index:40}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;padding:28px 22px 26px;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sa.framed .sheet{padding-bottom:34px}
.sheet .grab{position:absolute;left:50%;top:9px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
.stack{display:grid}
.stack>*{grid-area:1/1}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink)}
.banner{position:absolute;left:10px;right:10px;top:8px;z-index:50;background:var(--bg);border-radius:22px;padding:13px 16px 14px;box-shadow:0 12px 34px rgba(0,0,0,.2),0 0 0 1px var(--line);text-align:left;display:block;width:calc(100% - 20px)}
.sa.framed .banner{top:46px}
.banner .app{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mu);font-weight:600}
.banner .t{font-size:15px;font-weight:600;margin-top:6px}
.banner .d{font-size:14px;color:var(--ink-2)}
.toast{position:absolute;left:18px;right:18px;bottom:30px;z-index:50;background:var(--ink);color:var(--bg);border-radius:14px;padding:13px 16px;font-size:14.5px;font-weight:500}

/* ---------- parent (Amma) — large, simple ---------- */
.elder .page{padding:10px 22px 30px}
.langs{display:flex;gap:4px}
.langs button{height:36px;padding:0 12px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--mu)}
.langs button.on{background:var(--bg-2);color:var(--ink)}
.greet{font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.15;margin-top:14px}
.done-line{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;color:var(--ok);margin-top:14px}
.bigcall{display:flex;align-items:center;gap:16px;width:100%;padding:18px;border-radius:24px;box-shadow:inset 0 0 0 1.5px var(--line);margin-top:30px}
.bigcall .tx{flex:1;font-size:21px;font-weight:600}
.bigcall .ph{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center}
.helpbtn{margin-top:14px;width:100%;height:190px;border-radius:30px;background:var(--sos);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.helpbtn .l1{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.1}
.helpbtn .l2{font-size:15px;opacity:.92;padding:0 20px;text-align:center}
.redfull{background:var(--sos);color:#fff}
.redfull .greet{color:#fff}
.told{margin-top:26px}
.told div{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:600;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.25)}

/* ---------- call screen ---------- */
.call{background:#0F1316;color:#fff}
.call .who{font-family:var(--serif);font-size:38px;font-weight:500;text-align:center}
.call .sub{text-align:center;color:rgba(255,255,255,.65);font-size:15px}
.call .speak{padding:0 24px}
.call .said{font-size:21px;line-height:1.45;font-weight:500}
.call .tr{font-size:13.5px;line-height:1.4;color:rgba(255,255,255,.55);margin-top:8px}
.bars{display:flex;gap:3px;align-items:center;height:18px;margin-bottom:10px}
.bars i{width:3px;border-radius:2px;background:#7FD3A8;height:6px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 22px;padding:0 34px}
.keypad button{height:56px;border-radius:28px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.5);font-size:24px;font-weight:500;display:flex;align-items:center;justify-content:center}
.keypad button.hot{background:rgba(255,255,255,.16);color:#fff}
.keypad button.pressed{background:#fff;color:#0F1316}
.callbtn{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.callbtn.red{background:#E2453C} .callbtn.green{background:#2FB36F}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
@media (prefers-reduced-motion: reduce){.sa *{transition:none!important}}

/* ---- page: two phones with the story guide between them (desktop); one phone + step bar (narrow) ---- */
:root{--pg:#ECECE8;--pg-ink:#1B1B19;--pg-mu:#6E6E67;--pg-line:#D9D9D3;--pg-card:#F7F7F4;--frame:#1B1B19;--glow:rgba(27,27,25,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pg:#0C0C0B;--pg-ink:#EFEFEA;--pg-mu:#96968E;--pg-line:#2A2A27;--pg-card:#161615;--frame:#000;--glow:rgba(255,255,255,.12)}}
:root[data-theme="dark"]{--pg:#0C0C0B;--pg-ink:#EFEFEA;--pg-mu:#96968E;--pg-line:#2A2A27;--pg-card:#161615;--frame:#000;--glow:rgba(255,255,255,.12)}
html,body{height:100%}
body{margin:0;background:var(--pg);color:var(--pg-ink);font-family:Inter,system-ui,sans-serif}
.wrap{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;height:60px;flex:none}
.brand{display:flex;align-items:center;gap:9px;font-family:"Source Serif 4",Georgia,serif;font-size:22px;font-weight:600}
.brand small{font-family:Inter;font-size:12.5px;font-weight:500;color:var(--pg-mu);margin-left:4px}
.sound{display:flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--pg-line);background:none;color:var(--pg-ink);font:500 13.5px Inter,sans-serif;cursor:pointer}
.sound:focus-visible,.g-btn:focus-visible,.g-list button:focus-visible,.seg button:focus-visible{outline:2px solid var(--pg-ink);outline-offset:2px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:44px;padding-bottom:18px}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
.label{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--pg-mu);white-space:nowrap}
.label b{color:var(--pg-ink);font-weight:600}
.label .av{width:26px;height:26px;font-size:13px}
.device{box-sizing:border-box;position:relative;width:414px;height:868px;border-radius:58px;background:var(--frame);padding:12px;box-shadow:0 30px 70px rgba(0,0,0,.18);transition:box-shadow .4s}
.device.attn{box-shadow:0 0 0 4px var(--glow),0 30px 70px rgba(0,0,0,.18)}
.device .screen{width:390px;height:844px;border-radius:46px;overflow:hidden}
.scaler{transform-origin:top center}
.guide{width:290px;flex:none;align-self:center}
.g-k{font-size:13px;color:var(--pg-mu);font-weight:500}
.g-t{font-family:"Source Serif 4",Georgia,serif;font-size:30px;font-weight:500;line-height:1.15;margin:6px 0 12px;text-wrap:balance}
.g-p{font-size:15.5px;line-height:1.55;color:var(--pg-ink);margin:0}
.g-do{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--pg-card);border:1px solid var(--pg-line);font-size:15px;font-weight:600;line-height:1.45;display:flex;gap:10px;align-items:flex-start;min-height:52px}
.g-do .arr{font-size:18px;line-height:1.2}
.g-row{display:flex;gap:16px;margin-top:16px;align-items:center}
.g-btn{background:none;border:0;padding:0;color:var(--pg-mu);font:500 14px Inter,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.g-list{list-style:none;margin:30px 0 0;padding:16px 0 0;border-top:1px solid var(--pg-line);display:flex;flex-direction:column;gap:2px}
.g-list button{width:100%;display:flex;gap:12px;align-items:center;padding:8px 0;background:none;border:0;color:var(--pg-mu);font:500 14.5px Inter,sans-serif;cursor:pointer;text-align:left}
.g-list button .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--pg-line);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.g-list button.cur{color:var(--pg-ink);font-weight:600}
.g-list button.cur .n{border-color:var(--pg-ink);background:var(--pg-ink);color:var(--pg)}
.g-list button.done .n{border-color:var(--pg-ink)}
.hint{position:fixed;z-index:20;pointer-events:none;border-radius:18px;box-shadow:0 0 0 3px #E8A33D;animation:hint 1.4s ease-in-out infinite;display:none}
@keyframes hint{0%,100%{box-shadow:0 0 0 3px rgba(232,163,61,.95),0 0 0 3px rgba(232,163,61,.5)}60%{box-shadow:0 0 0 3px rgba(232,163,61,.95),0 0 0 14px rgba(232,163,61,0)}}
@media (prefers-reduced-motion: reduce){.hint{animation:none}}
.mbar{display:none}
/* ---- single-phone layout ---- */
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mstep{font-size:13px;color:var(--pg-mu);font-weight:500}
.mdo{font-size:15px;font-weight:600;line-height:1.4;min-height:21px}
.seg{display:flex;background:var(--pg-card);border:1px solid var(--pg-line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border:0;border-radius:9px;background:none;color:var(--pg-mu);font:600 13.5px Inter,sans-serif;cursor:pointer;position:relative}
.seg button.on{background:var(--pg-ink);color:var(--pg)}
.seg button .ping{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:#E8A33D;display:none}
.seg button.attn .ping{display:block}
.mnext{background:none;border:0;color:var(--pg-mu);font:500 13px Inter,sans-serif;text-decoration:underline;cursor:pointer;padding:0}
@media (max-width:999px){
  .stage{gap:0}
  .guide,.top,.label{display:none}
  .col.off{display:none}
  .mbar{display:flex;flex-direction:column;gap:10px;padding:10px 0 12px;flex:none}
}
@media (max-width:599px){
  html,body{overflow:hidden}
  .wrap{padding:0;height:100%}

<script>
/* Saath — interface sounds, synthesised with WebAudio (no audio files).
   Same names and recipes as video/audio.py, which renders them for the video. */
(function (g) {
  'use strict';
  let ctx = null, master = null, on = true, ringTimer = null;
  function ensure() {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(f, t, len, gain, type = 'sine', attack = .004) {
    const o = ctx.createOscillator(), a = ctx.createGain();
    o.type = type; o.frequency.value = f;
    a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(gain, t + attack); a.gain.exponentialRampToValueAtTime(.0001, t + len);
    o.connect(a).connect(master); o.start(t); o.stop(t + len + .05);
  }
  const marimba = (f, t, g = .22) => { tone(f, t, .7, g, 'sine', .002); tone(f * 3.93, t, .14, g * .22, 'sine', .001); tone(f * 9.2, t, .05, g * .06, 'sine', .001); };
  const bell = (f, t, g = .16) => { tone(f, t, 1.5, g, 'sine', .003); tone(f * 2.76, t, .7, g * .3, 'sine', .002); tone(f * 5.4, t, .3, g * .1, 'sine', .002); };
  const N = { D5: 587.33, Fs5: 739.99, A5: 880, B5: 987.77, D6: 1174.66, E6: 1318.51, Fs6: 1479.98, A6: 1760 };
  const DTMF = { 1: [697, 1209], 2: [697, 1336], 3: [697, 1477], 4: [770, 1209], 5: [770, 1336], 6: [770, 1477], 7: [852, 1209], 8: [852, 1336], 9: [852, 1477], '*': [941, 1209], 0: [941, 1336], '#': [941, 1477] };
  const SFX = {
    ring: t => { [N.D5, N.Fs5, N.A5, N.Fs5].forEach((f, i) => marimba(f, t + i * .17)); [N.D5, N.Fs5, N.A5, N.B5].forEach((f, i) => marimba(f, t + .8 + i * .17)); },
    connect: t => { tone(1046.5, t, .09, .07); tone(1318.5, t + .1, .12, .07); },
    hangup: t => { tone(659.25, t, .14, .08); tone(523.25, t + .16, .2, .08); },
    notify: t => { bell(N.E6, t); bell(N.A6, t + .12, .12); },
    success: t => { [N.D6, N.Fs6, N.A6].forEach((f, i) => marimba(f, t + i * .08, .17)); },
    tick: t => marimba(N.A5, t, .14),
    help: t => { tone(196, t, .35, .3, 'sine', .002); tone(392, t, .25, .1, 'triangle', .002); },
    alert: t => { for (let r = 0; r < 2; r++) for (let i = 0; i < 3; i++) { const s = t + r * .8 + i * .19; tone(880, s, .14, .1, 'triangle'); tone(1318.5, s, .14, .06); } },
    resolve: t => { marimba(N.A5, t, .15); marimba(N.D5, t + .15, .15); }
  };
  function startRing() { stopRing(); if (!on || !ensure()) return; const go = () => SFX.ring(ctx.currentTime + .03); go(); ringTimer = setInterval(go, 2700); }
  function stopRing() { if (ringTimer) { clearInterval(ringTimer); ringTimer = null; } }
  function play(name) {
    if (name === 'ring_stop') return stopRing();
    if (!on || !ensure()) return;
    if (name === 'ring_start') return startRing();
    const t = ctx.currentTime + .01;
    if (name.startsWith('dtmf_')) { const p = DTMF[name.slice(5)]; if (p) { tone(p[0], t, .16, .06); tone(p[1], t, .16, .06); } return; }
    if (SFX[name]) SFX[name](t);
  }
  g.SaathSound = { play, unlock: ensure, setOn(v) { on = v; if (!v) stopRing(); }, isOn: () => on, isRinging: () => !!ringTimer };
})(window);

</script>

      <div style="margin-top:18px"><button class="btn on-red" id="call-amma" data-act="toast" data-arg="Calling Amma…">${ic('phone', 18)}Call Amma</button></div></div>
    <div class="scroll"><div class="page" style="padding-top:4px">
      <div class="sec" style="margin-top:14px">Happening now</div>
      <div class="live">
        ${it(.5, '<b>Shobha</b> is on her way<small>Neighbour · 2 minutes away</small>')}
        ${it(1.2, '<b>Ravi</b> is coming<small>Sahayak · about 11 minutes</small>')}
        ${it(1.9, '<b>Karthik</b> has been told<small>In Singapore</small>')}
        <div class="it big"${timed(t0 + 4.6)}>${ic('check', 18)}<div><span style="font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--mu)">6:45 PM · Shobha is with Amma</span><br>“She felt dizzy, so she’s sitting down. Her BP is 104/68.”</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:22px">
        <button class="btn" id="close-alert" data-act="closeAlert">She’s okay · close alert</button>
        <button class="btn sos-line" data-act="toast" data-arg="This opens your dialer with 112">Call 112</button></div>
    </div></div>`;
}

/* ---------------- Amma's phone ---------------- */
function aCall(W, P) {
  const c = W.call, l = L[W.lang], s = c.stage;
  if (s === 0) return `<div class="call" style="flex:1;display:flex;flex-direction:column">
      <div style="margin-top:110px"><div class="sub">Incoming call</div><div class="who" style="margin-top:6px">Saath</div><div class="sub" style="margin-top:4px">${l.morning} · ${l.name}</div></div>
      <div style="position:relative;width:118px;height:118px;margin:56px auto 0"><span class="ring"></span><span class="ring" data-ring-delay=".8"></span><span style="position:absolute;inset:14px;border-radius:50%;background:#1F2A2E;display:flex;align-items:center;justify-content:center;color:#fff">${MARK(44)}</span></div>
      <div style="margin-top:auto;display:flex;justify-content:space-around;padding:0 46px 64px">
        <div style="text-align:center"><button class="callbtn red" data-act="decline" aria-label="Decline">${ic('hang', 30)}</button><div class="sub" style="margin-top:8px">Decline</div></div>
        <div style="text-align:center"><button class="callbtn green" id="answer" data-act="answer" aria-label="Answer">${ic('phone', 28)}</button><div class="sub" style="margin-top:8px">Answer</div></div></div></div>`;
  const q = IVR[W.lang][Math.min(2, s - 1)], qen = IVR.en[Math.min(2, s - 1)];
  const qAt = s === 1 ? c.t1 + .3 : s === 2 ? c.t2 + .45 : c.t3 + .45;
  const hot = s === 1 ? ['1', '2'] : s === 2 ? ['1', '2', '9'] : [];
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '*', '0', '#'].map(k => {
    const press = (s >= 2 && k === c.a1) ? ` data-press="${s === 2 ? c.t2 : -9}"` : '';
    const press2 = (s >= 3 && k === c.a2) ? ` data-press="${c.t3}"` : '';
    return `<button class="${hot.includes(k) ? 'hot' : ''}" id="key-${k === '*' ? 'star' : k === '#' ? 'hash' : k}" data-act="key" data-arg="${k}"${press2 || press}>${k}</button>`; }).join('');
  return `<div class="call" style="flex:1;display:flex;flex-direction:column">
    <div style="margin-top:58px"><div class="who" style="font-size:28px">Saath</div><div class="sub">${s >= 3 ? 'Call ending' : l.morning + ' · ' + l.name}</div></div>
    <div class="speak" style="margin-top:34px;min-height:200px"${timed(qAt)}><div class="bars" aria-hidden="true">${'<i></i>'.repeat(9)}</div><div class="said">${q}</div>${W.lang !== 'en' ? `<div class="tr">${qen}</div>` : ''}</div>
    <div class="keypad" style="margin-top:auto">${keys}</div>
    <div style="display:flex;justify-content:center;padding:22px 0 40px"><button class="callbtn red" id="end-call" data-act="endCall" aria-label="End call">${ic('hang', 30)}</button></div></div>`;
}
function aHome(W, P) {
  const l = L[W.lang];
  return `<div class="scroll elder"><div class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px"><span class="meta" style="font-size:15px">${l.date}</span>
      <span class="langs">${['kn', 'hi', 'en'].map(k => `<button class="${W.lang === k ? 'on' : ''}" data-act="lang" data-arg="${k}">${L[k].name}</button>`).join('')}</span></div>
    <div class="greet">${l.greet}</div>
    ${W.call.stage >= 3 ? `<div class="done-line">${ic('check', 22, 'style="stroke-width:2.6"')}${l.done}</div>` : ''}
    <button class="bigcall" id="call-priya" data-act="toast" data-arg="${l.call}…"><span class="av priya" style="width:56px;height:56px;font-size:24px">P</span><span class="tx">${l.call}</span><span class="ph">${ic('phone', 26)}</span></button>
    <button class="helpbtn" id="help" data-act="help">${ic('bell', 34)}<span class="l1">${l.help}</span><span class="l2">${l.helpSub}</span></button>
  </div></div>`;
}
function aHelp(W, P) {
  const l = L[W.lang], t0 = W.help ? W.help.at : 0;
  return `<div class="scroll redfull elder"><div class="page" style="padding-top:70px">
    <div style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center">${ic('bell', 34)}</div>
    <div class="greet" style="margin-top:22px">${l.coming}</div>
    <div class="told">${l.told.map((x, i) => `<div${timed(t0 + .6 + i * .7)}>${ic('check', 24, 'style="stroke-width:2.6"')}${x}</div>`).join('')}</div>
    <div style="margin-top:34px"><button class="btn on-red" id="okay" data-act="okay" style="height:64px;font-size:19px;border-radius:20px">${l.okay}</button></div>
  </div></div>`;
}

const VIEWS = { p_home: pHome, p_parent: pParent, p_request: pRequest, p_visit: pVisit, p_alert: pAlert, a_call: aCall, a_home: aHome, a_help: aHelp };
const FLUSH = { a_call: 1, a_help: 1, p_alert: 1 };

function sheetHtml(k, W) {
  if (k !== 'pay') return '';
  const t = W.pay ? W.pay.at + 1.7 : 0;
  return `<div class="stack" style="min-height:190px;text-align:center">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px" data-t1="${t.toFixed(3)}"><div class="spin"></div><div style="font-size:17px;font-weight:600">Approve ₹399 in your UPI app</div><div class="meta">Paying Saath Care, Mysuru</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px"${timed(t)}><span style="width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center">${ic('check', 32, 'style="stroke-width:2.6"')}</span><div style="font-size:19px;font-weight:600">Paid ₹399</div><div class="meta">UPI · 8:34 AM</div></div></div>`;
}

/* ---------------- reducer ---------------- */
function reduce(S, dev, a, arg, at) {
  const W = S.W, P = S.P[dev], A = S.P.amma, Pr = S.P.priya;
  const nav = (ph, to, kind) => { if (ph.screen === to && kind === 'fade') return; ph.nav = { from: ph.screen, to, at, kind }; ph.screen = to; };
  switch (a) {
    case 'go': { const [scr, p] = (arg || '').split(':'); if (p) P.parent = p; P.stack.push(P.screen); nav(P, scr, 'push'); break; }
    case 'back': nav(P, P.stack.pop() || (dev === 'amma' ? 'a_home' : 'p_home'), 'pop'); break;
    case 'toast': P.toast = { text: arg, at }; break;
    case 'lang': W.lang = arg; break;
    /* Amma */
    case 'answer': if (W.call.stage !== 0) return; W.call = { stage: 1, t1: at }; W.clock = '8:31 AM'; S.sound('ring_stop', at); S.sound('connect', at); break;
    case 'decline': P.toast = { text: 'Saath will call again in 15 minutes.', at }; break;
    case 'key': { const c = W.call; S.sound('dtmf_' + arg, at);
      if (c.stage === 1 && (arg === '1' || arg === '2')) { c.a1 = arg; c.stage = 2; c.t2 = at; }
      else if (c.stage === 2 && ['1', '2', '9'].includes(arg)) { c.a2 = arg; c.stage = 3; c.t3 = at;
        if (arg === '9') { S.schedule(1.4, 'amma', 'endCall'); S.schedule(1.6, 'amma', 'help'); }
        else { S.schedule(1.4, 'priya', 'notify'); S.schedule(3.6, 'amma', 'endCall'); } }
      break; }
    case 'endCall': { const c = W.call; if (c.stage === 4) return;
      if (c.stage < 3) { W.call = { stage: 0 }; P.toast = { text: 'Call ended. Saath will try again shortly.', at }; S.sound('hangup', at); S.schedule(2.2, 'amma', 'ringAgain'); return; }
      c.stage = 4; S.sound('hangup', at); nav(A, 'a_home', 'fade'); if (W.step === 1) W.step = 2; break; }
    case 'ringAgain': if (W.call.stage === 0) S.sound('ring_start', at); break;
    case 'help': if (W.help) return; W.help = { at }; W.clock = '6:42 PM'; if (W.call.stage < 3) W.call = { stage: 4, a1: '1', a2: '1' }; nav(A, 'a_help', 'fade'); S.sound('help', at); S.schedule(1.4, 'priya', 'alertIn'); break;
    case 'okay': W.help = null; nav(A, 'a_home', 'fade');
      if (W.alert && !W.resolved) { W.resolved = true; Pr.stack = []; nav(Pr, 'p_home', 'fade'); Pr.toast = { text: 'Amma says she’s okay.', at }; }
      if (W.step === 4) W.step = 5; break;
    /* Priya */
    case 'notify': Pr.banner = { k: 'checkin', at }; S.sound('notify', at); break;
    case 'openBanner': Pr.banner = null; if (Pr.screen !== 'p_home') { Pr.stack = []; nav(Pr, 'p_home', 'fade'); } break;
    case 'pay': if (W.booked || P.sheet) return; P.sheet = { k: 'pay', at }; W.pay = { at }; S.schedule(1.7, 'priya', 'paid'); break;
    case 'paid': W.booked = true; W.clock = '8:34 AM'; S.sound('success', at); S.schedule(1.3, 'priya', 'closeSheet'); break;
    case 'closeSheet': if (P.sheet) { P.sheetClose = { k: P.sheet.k, at }; P.sheet = null; } break;
    case 'doneRequest': P.stack = []; nav(P, 'p_home', 'pop'); if (W.step === 2) W.step = 3; break;
    case 'seeVisit': P.stack.push(P.screen); nav(P, 'p_visit', 'push');
      if (W.visit < 0) { W.visit = 0; W.visitAt = [at + .35]; W.clock = '4:00 PM'; S.sound('tick', at + .35); S.schedule(2.8, 'priya', 'visitNext'); S.schedule(5.6, 'priya', 'visitNext'); }
      if (W.step === 2) W.step = 3; break;
    case 'visitNext': if (W.visit >= 2) return; W.visit++; W.visitAt[W.visit] = at; W.clock = VISIT[W.visit][0]; S.sound('tick', at); if (W.visit === 2 && W.step === 3) W.step = 4; break;
    case 'alertIn': W.alert = { at }; W.resolved = false; Pr.sheet = null; Pr.banner = null; Pr.stack = ['p_home']; nav(Pr, 'p_alert', 'fade'); S.sound('alert', at); break;
    case 'openAlert': P.stack.push(P.screen); nav(P, 'p_alert', 'push'); break;
    case 'closeAlert': W.resolved = true; W.help = null; Pr.stack = []; nav(Pr, 'p_home', 'pop'); Pr.toast = { text: 'Alert closed. Shobha is staying with Amma tonight.', at: at + .35 };
      if (A.screen === 'a_help') nav(A, 'a_home', 'fade'); if (W.step === 4) W.step = 5; S.sound('resolve', at); break;
  }
}

/* ---------------- store ---------------- */
function createStore(opts = {}) {
  const S = { mode: opts.mode || 'live', time: 0, W: newWorld(), P: { amma: newPhone('amma'), priya: newPhone('priya') }, els: {}, gen: 0, pending: [], sounds: [] };
  S.now = () => S.mode === 'video' ? S.time : performance.now() / 1000;
  S.sound = (name, at) => { if (S.mode === 'video') S.sounds.push({ name, at }); else if (opts.onSound) { const d = at - S.now(); d > .02 ? setTimeout(() => opts.onSound(name), d * 1000) : opts.onSound(name); } };
  S.schedule = (delay, dev, act, arg) => { const at = S.now() + delay;
    if (S.mode === 'video') S.pending.push({ at, dev, act, arg });
    else { const g = S.gen; setTimeout(() => { if (g === S.gen) S.dispatch(dev, act, arg); }, delay * 1000); } };
  S.dispatch = (dev, act, arg) => { reduce(S, dev, act, arg, S.now()); S.renderAll(); if (opts.onChange) opts.onChange(S); };
  S.click = (dev, b) => S.dispatch(dev, b.dataset.act, b.dataset.arg);

  S.attach = (dev, el, o = {}) => {
    el.classList.add('sa'); if (o.framed) el.classList.add('framed');
    S.els[dev] = el;
    el.addEventListener('click', e => { if (S.mode === 'video') return; const b = e.target.closest('[data-act]'); if (!b || !el.contains(b)) return; e.preventDefault(); S.click(dev, b); });
    S.render(dev);
  };
  S.render = dev => {
    const el = S.els[dev], W = S.W, P = S.P[dev], t = S.now();
    const sc = el.querySelector('.layer.cur .scroll'), keep = el.dataset.scr === P.screen && S.mode !== 'video' ? (sc ? sc.scrollTop : 0) : 0;
    const view = scr => VIEWS[scr](W, P, S);
    const showPrev = P.nav && P.nav.from && P.nav.from !== P.screen && t - P.nav.at < .6;
    const sk = P.sheet ? P.sheet.k : (P.sheetClose && t - P.sheetClose.at < .5 ? P.sheetClose.k : null);
    const sAt = P.sheet ? P.sheet.at : P.sheetClose ? P.sheetClose.at : 0;
    const overlays = (sk ? `<div class="dim"></div><div class="sheet" role="dialog" data-at="${sAt}" data-closing="${P.sheet ? 0 : 1}"><div class="grab"></div>${sheetHtml(sk, W)}</div>` : '')
      + (P.banner && t - P.banner.at < 6 ? `<button class="banner" id="banner" data-act="openBanner" data-at="${P.banner.at}"><span class="app">${MARK(14)}Saath · now</span><div class="t">Amma answered her morning call</div><div class="d">Took her medicine · feeling fine</div></button>` : '')
      + (P.toast && t - P.toast.at < 3.4 ? `<div class="toast" data-at="${P.toast.at}">${P.toast.text}</div>` : '');
    const dark = P.screen === 'a_call' || P.screen === 'a_help' || P.screen === 'p_alert';
    el.classList.toggle('on-dark', dark);
    const status = `<div class="sa-status"><span>${W.clock.replace(/ (AM|PM)/, '')}</span><span class="cam"></span><span style="display:flex;gap:6px;align-items:center"><svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="1"/><rect x="9" y="3" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".4"/></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="14" height="7" rx="2" fill="currentColor"/></svg></span></div>`;
    el.innerHTML = status
      + (showPrev ? `<section class="layer prev${FLUSH[P.nav.from] ? ' flush' : ''}" data-scr="${P.nav.from}">${view(P.nav.from)}</section>` : '')
      + `<section class="layer cur${FLUSH[P.screen] ? ' flush' : ''}" data-scr="${P.screen}">${view(P.screen)}</section>` + overlays + `<div class="gesture"></div>`;
    el.dataset.scr = P.screen;
    const nsc = el.querySelector('.layer.cur .scroll'); if (nsc && keep) nsc.scrollTop = keep;
    animatePhone(S, dev, t);
  };
  S.renderAll = () => Object.keys(S.els).forEach(S.render);
  S.animate = t => Object.keys(S.els).forEach(d => animatePhone(S, d, t));
  S.snapshot = () => JSON.parse(JSON.stringify({ W: S.W, P: S.P }));
  S.restore = s => { const c = JSON.parse(JSON.stringify(s)); S.W = c.W; S.P = c.P; };
  S.gotoStep = n => {
    S.gen++; S.pending = []; const at = S.now(); const W = newWorld(), A = newPhone('amma'), Pr = newPhone('priya');
    if (n >= 2) { W.call = { stage: 4, a1: '1', a2: '1' }; W.clock = '8:31 AM'; A.screen = 'a_home'; W.step = 2; }
    if (n >= 3) { W.booked = true; W.clock = '8:34 AM'; W.step = 3; }
    if (n >= 4) { W.visit = 2; W.visitAt = [0, 0, 0]; W.clock = '6:40 PM'; W.step = 4; }
    if (n >= 5) { W.step = 5; W.alert = { at: 0 }; W.resolved = true; W.clock = '6:50 PM'; }
    [A, Pr].forEach(p => { p.nav = { from: null, to: p.screen, at, kind: 'fade' }; });
    S.W = W; S.P = { amma: A, priya: Pr };
    S.sound(n === 1 ? 'ring_start' : 'ring_stop', at);
    S.renderAll(); if (opts.onChange) opts.onChange(S);
  };
  if (S.mode !== 'video') {
    const loop = () => { const t = S.now();
      for (const dev in S.els) { const el = S.els[dev], P = S.P[dev];
        if (P.nav && t - P.nav.at > .6) el.querySelector('.layer.prev')?.remove();
        if (P.toast && t - P.toast.at > 3.5) { P.toast = null; el.querySelector('.toast')?.remove(); }
        if (P.banner && t - P.banner.at > 6) { P.banner = null; el.querySelector('.banner')?.remove(); }
        if (P.sheetClose && t - P.sheetClose.at > .5) { P.sheetClose = null; el.querySelector('.sheet')?.remove(); el.querySelector('.dim')?.remove(); } }
      S.animate(t); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  return S;
}

/* ---------------- per-phone animation (pure function of t) ---------------- */
function animatePhone(S, dev, t) {
  const el = S.els[dev], P = S.P[dev]; if (!el) return;
  const nav = P.nav, cur = el.querySelector('.layer.cur'), prev = el.querySelector('.layer.prev');
  const D = nav && nav.kind === 'fade' ? .36 : .42, p = nav ? clamp((t - nav.at) / D) : 1, e = eio(p);
  if (cur) { cur.style.zIndex = 2; cur.style.opacity = 1; cur.style.transform = 'none';
    if (nav && p < 1) { if (nav.kind === 'push') cur.style.transform = `translateX(${(1 - e) * 100}%)`;
      else if (nav.kind === 'pop') { cur.style.zIndex = 1; cur.style.transform = `translateX(${-(1 - e) * 20}%)`; }
      else cur.style.opacity = e; } }
  if (prev) { if (!nav || p >= 1) prev.style.visibility = 'hidden';
    else { prev.style.visibility = 'visible';
      if (nav.kind === 'push') { prev.style.zIndex = 1; prev.style.transform = `translateX(${-e * 20}%)`; }
      else if (nav.kind === 'pop') { prev.style.zIndex = 3; prev.style.transform = `translateX(${e * 100}%)`; }
      else { prev.style.zIndex = 1; prev.style.opacity = 1 - e; } } }
  el.querySelectorAll('[data-t0],[data-t1]').forEach(n => {
    const t0 = n.dataset.t0 ? +n.dataset.t0 : -1e9, t1 = n.dataset.t1 ? +n.dataset.t1 : 1e9;
    const o = t < t0 || t >= t1 ? 0 : clamp((t - t0) / .4);
    n.style.opacity = o; n.style.visibility = o <= 0 ? 'hidden' : 'visible'; n.style.transform = `translateY(${(1 - eout(clamp((t - t0) / .45))) * 8}px)`; });
  const sh = el.querySelector('.sheet'), dim = el.querySelector('.dim');
  if (sh) { let q = eout(clamp((t - +sh.dataset.at) / .36)); if (sh.dataset.closing === '1') q = 1 - q;
    sh.style.transform = `translateY(${(1 - q) * 105}%)`; dim.style.opacity = q; const v = q <= .001 ? 'hidden' : 'visible'; sh.style.visibility = v; dim.style.visibility = v; }
  const bn = el.querySelector('.banner');
  if (bn) { const at = +bn.dataset.at, q = eout(clamp((t - at) / .45)), out = clamp((t - at - 5.2) / .4);
    bn.style.transform = `translateY(${-140 * (1 - q) - 140 * out * out}px)`; bn.style.visibility = t < at || out >= 1 ? 'hidden' : 'visible'; }
  const to = el.querySelector('.toast');
  if (to) { const at = +to.dataset.at, o = Math.min(clamp((t - at) / .25), clamp((at + 3 - t) / .3)); to.style.opacity = o; to.style.visibility = o <= 0 ? 'hidden' : 'visible'; to.style.transform = `translateY(${(1 - o) * 10}px)`; }
  el.querySelectorAll('.spin').forEach(n => n.style.transform = `rotate(${(t * 420) % 360}deg)`);
  el.querySelectorAll('.ring').forEach(n => { const ph = ((t + (+n.dataset.ringDelay || 0)) % 1.6) / 1.6; n.style.transform = `scale(${1 + ph * .6})`; n.style.opacity = (1 - ph) * .9; });
  el.querySelectorAll('[data-press]').forEach(n => { const at = +n.dataset.press; n.classList.toggle('pressed', t >= at - .03 && t < at + .4); });
  el.querySelectorAll('.bars i').forEach((n, i) => { n.style.height = (5 + 12 * Math.abs(Math.sin(t * 7.3 + i * 1.7) * Math.sin(t * 2.1 + i))) + 'px'; });
}

global.Saath = { createStore, newWorld };
})(window);

</script>
<script>
(function () {
  const STEPS = [
    { t: 'Morning call', p: 'It’s 8:30 AM in Mysuru. Every morning Saath calls Amma in Kannada. She doesn’t need a smartphone, just the keypad.' },
    { t: 'Find a helper', p: 'In Bengaluru, Priya sees her mother is fine. But Appa has a heart check-up at 4:30 PM and no one can go with him.' },
    { t: 'The visit', p: 'At 4 PM a verified local helper, Ravi, takes Appa to the doctor and sends Priya what the doctor said.' },
    { t: 'Help button', p: 'That evening Amma feels dizzy. One press tells her daughter, her neighbour and Ravi at the same time.' }
  ];
  const $ = id => document.getElementById(id);
  const store = Saath.createStore({ onChange: () => { refresh(true); }, onSound: n => SaathSound.play(n) });
  store.attach('amma', $('amma'), { framed: true });
  store.attach('priya', $('priya'), { framed: true });

  function cue() {
    const S = store, W = S.W, A = S.P.amma, P = S.P.priya, t = S.now();
    switch (W.step) {
      case 1: { const s = W.call.stage;
        if (s === 0) return { dev: 'amma', sel: '#answer', text: 'Answer the call on Amma’s phone.' };
        if (s === 1) return { dev: 'amma', sel: '#key-1', text: 'Press 1. She took her medicine.' };
        if (s === 2) return { dev: 'amma', sel: '#key-1', text: 'Press 1 again. She’s feeling fine.' };
        return { dev: 'priya', sel: null, text: 'Now watch Priya’s phone.' }; }
      case 2:
        if (P.banner && t - P.banner.at < 5.5 && P.screen === 'p_home' && !P.sheet) return { dev: 'priya', sel: '#banner', text: 'Priya got a notification. Tap it.' };
        if (P.screen === 'p_request') { if (P.sheet) return { dev: 'priya', sel: null, text: 'Paying with UPI…' };
          return W.booked ? { dev: 'priya', sel: '#done-request', text: 'Ravi is booked. Tap Done.' } : { dev: 'priya', sel: '#pay', text: 'Read the details, then pay ₹399 with UPI.' }; }
        if (P.screen !== 'p_home') return { dev: 'priya', sel: '.layer.cur [data-act=back]', text: 'Go back to Priya’s home screen.' };
        return { dev: 'priya', sel: '#find-help', text: 'Tap “Find someone to go”.' };
      case 3:
        if (P.screen === 'p_visit') return { dev: 'priya', sel: null, text: 'The visit updates by itself. Scroll down for the doctor’s advice.' };
        if (P.screen !== 'p_home') return { dev: 'priya', sel: '.layer.cur [data-act=back]', text: 'Go back to Priya’s home screen.' };
        return { dev: 'priya', sel: '#see-visit', text: 'Tap “See the visit”.' };
      case 4:
        if (W.alert && !W.resolved) {
          if (P.screen !== 'p_alert') return { dev: 'priya', sel: '#open-alert', text: 'Open the alert on Priya’s phone.' };
          if (t < W.alert.at + 4.8) return { dev: 'priya', sel: null, text: 'Watch who is on the way.' };
          return { dev: 'priya', sel: '#close-alert', text: 'Shobha is with Amma. Close the alert.' }; }
        if (W.help) return { dev: 'priya', sel: null, text: 'Priya’s phone is about to light up.' };
        return { dev: 'amma', sel: '#help', text: 'Press Help on Amma’s phone.' };
      default: return { dev: null, sel: null, text: '' };
    }
  }

  /* ---- guide (desktop) and step bar (narrow) ---- */
  let lastKey = '', single = false, shown = 'amma';
  function refresh(force) {
    const W = store.W, c = cue(), step = Math.min(W.step, 5);
    const key = step + '|' + c.text + '|' + c.dev;
    if (!force && key === lastKey) return; lastKey = key;
    const done = step > 4;
    const arrow = c.dev === 'amma' ? '←' : c.dev === 'priya' ? '→' : '';
    $('guide').innerHTML = done
      ? `<div class="g-k">The end</div><div class="g-t">That’s Saath.</div><p class="g-p">A daily call in her own language. A trusted helper nearby. The whole family in the loop.</p><div class="g-row"><button class="g-btn" data-restart>Start over</button></div>${list(step)}`
      : `<div class="g-k">Step ${step} of 4</div><div class="g-t">${STEPS[step - 1].t}</div><p class="g-p">${STEPS[step - 1].p}</p>
         <div class="g-do">${arrow ? `<span class="arr" aria-hidden="true">${arrow}</span>` : ''}<span>${c.text}</span></div>
         <div class="g-row"><button class="g-btn" data-next>Skip this step</button><button class="g-btn" data-restart>Start over</button></div>${list(step)}`;
    $('m-step').textContent = done ? 'The end · That’s Saath' : `Step ${step} of 4 · ${STEPS[step - 1].t}`;
    $('m-do').textContent = done ? 'A daily call, a trusted helper, the family in the loop.' : c.text;
    $('m-next').textContent = done ? 'Start over' : 'Skip step';
    document.querySelectorAll('.device').forEach(d => d.classList.toggle('attn', !single && d.id === 'dev-' + c.dev));
    if (single && c.dev && c.dev !== shown) showPhone(c.dev);
    $('m-amma').classList.toggle('attn', c.dev === 'amma' && shown !== 'amma');
    $('m-priya').classList.toggle('attn', c.dev === 'priya' && shown !== 'priya');
  }
  function list(step) {
    return `<ol class="g-list">${STEPS.map((s, i) => `<li><button class="${i + 1 === step ? 'cur' : i + 1 < step ? 'done' : ''}" data-goto="${i + 1}"><span class="n">${i + 1 < step ? '✓' : i + 1}</span>${s.t}</button></li>`).join('')}</ol>`;
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-next],[data-restart],[data-goto]'); if (!b) return;
    if (b.hasAttribute('data-restart')) store.gotoStep(1);
    else if (b.hasAttribute('data-goto')) store.gotoStep(+b.dataset.goto);
    else store.gotoStep(store.W.step >= 5 ? 1 : store.W.step + 1);
  });
  $('m-next').addEventListener('click', () => store.gotoStep(store.W.step >= 5 ? 1 : store.W.step + 1));
  $('m-amma').addEventListener('click', () => showPhone('amma'));
  $('m-priya').addEventListener('click', () => showPhone('priya'));
  function showPhone(dev) { shown = dev; $('col-amma').classList.toggle('off', dev !== 'amma'); $('col-priya').classList.toggle('off', dev !== 'priya');
    $('m-amma').classList.toggle('on', dev === 'amma'); $('m-priya').classList.toggle('on', dev === 'priya'); lastKey = ''; }

  /* ---- hint ring on the next thing to tap ---- */
  const hint = $('hint');
  function placeHint() {
    const c = cue(); let el = null;
    if (c.sel && (!single || c.dev === shown)) el = $(c.dev).querySelector('.layer.cur ' + c.sel) || $(c.dev).querySelector(c.sel);
    if (el) { const r = el.getBoundingClientRect(); if (r.width) { hint.style.display = 'block'; hint.style.left = (r.left - 5) + 'px'; hint.style.top = (r.top - 5) + 'px'; hint.style.width = (r.width + 10) + 'px'; hint.style.height = (r.height + 10) + 'px';
        hint.style.borderRadius = getComputedStyle(el).borderRadius === '50%' ? '50%' : (parseFloat(getComputedStyle(el).borderRadius) + 5 || 16) + 'px'; } else hint.style.display = 'none'; }
    else hint.style.display = 'none';
    refresh(false);
    requestAnimationFrame(placeHint);
  }

  /* ---- layout: fit two phones, or switch to one ---- */
  function layout() {
    const w = innerWidth, h = innerHeight;
    single = matchMedia('(max-width:999px)').matches;
    const bleed = matchMedia('(max-width:599px)').matches;
    ['amma', 'priya'].forEach(d => $(d).classList.toggle('framed', !bleed));
    if (single) { showPhone(shown); }
    else { $('col-amma').classList.remove('off'); $('col-priya').classList.remove('off'); }
    const avail = single ? h - 150 : h - 60 - 60;
    let s = Math.min(1, avail / 868);
    if (!single) s = Math.min(s, (w - 290 - 88 - 40) / 828);
    document.querySelectorAll('.scaler').forEach(x => { x.style.transform = bleed ? '' : `scale(${s})`; x.style.height = bleed ? '' : (868 * s) + 'px'; x.style.width = bleed ? '' : (414 * s) + 'px'; x.style.transformOrigin = 'top left'; });
    lastKey = '';
  }
  addEventListener('resize', layout); layout();

  /* ---- sound ---- */
  function setSound(v) { SaathSound.setOn(v); ['sound', 'm-sound'].forEach(id => { $(id).textContent = v ? 'Sound on' : 'Sound off'; $(id).setAttribute('aria-pressed', v); });
    if (v && store.W.call.stage === 0 && store.W.step === 1) SaathSound.play('ring_start'); }
  $('sound').addEventListener('click', () => setSound(!SaathSound.isOn()));
  $('m-sound').addEventListener('click', () => setSound(!SaathSound.isOn()));
  addEventListener('pointerdown', function first() { removeEventListener('pointerdown', first); SaathSound.unlock(); if (SaathSound.isOn() && store.W.call.stage === 0 && store.W.step === 1) setTimeout(() => { if (store.W.call.stage === 0) SaathSound.play('ring_start'); }, 60); });

  refresh(true); requestAnimationFrame(placeHint);
})();
</script>
